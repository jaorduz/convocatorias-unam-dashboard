cards:
- title: Nobel Prizes 2026
  category: Reconocimie
  message: Between 1901 and 2026, the Nobel Prizes and the Sveriges Riksbank Prize
    in Economic Sciences in Memory of Alfred Nobel were awarded 639 times to 1,036
    people and organisations. With some receiving the Nobel Prize more than once,
    this makes a total of 1,000 individuals and 28 organisations. Below, you can view
    the full list of Nobel Prizes and Nobel Prize laureates.
  source: The Nobel Prize
  label: Ver aviso
  publish_to:
  - dashboard
  - newsletter
  link: https://www.nobelprize.org/all-nobel-prizes-2026/
